global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alert_rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]

  - job_name: victim
    static_configs: [{targets: ["victim:8080"]}]

  # Postgres via its exporter. instance is renamed to db-primary:9187 so the alert is about
  # the database itself, and merges with the "Connection refused to db-primary" logs.
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
    relabel_configs:
      - target_label: instance
        replacement: db-primary:9187
