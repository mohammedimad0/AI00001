server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: victim
    static_configs:
      - targets: [localhost]
        labels:
          __path__: /var/log/victim/*.log
    pipeline_stages:
      # "<time> <LEVEL> <host> <job> <message>"  ->  labels host + job
      - regex:
          expression: '^(?P<ts>\S+) (?P<level>\w+) (?P<host>\S+) (?P<job>\S+) (?P<msg>.*)$'
      - labels:
          host:
          job:
      - timestamp:
          source: ts
          format: RFC3339Nano
      # ship "<time> <LEVEL> <message>" (the format our normalizer reads)
      - template:
          source: out
          template: '{{ .ts }} {{ .level }} {{ .msg }}'
      - output:
          source: out
      - labeldrop: [filename]
